<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autodesk Fusion magyarítás</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#0a6cff;--bd:#e3e6eb}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#eef1f5;--mut:#9aa4b2;--bd:#2c323b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.prod{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.prod input{margin-top:6px}
.prod b{display:block}
.prod small{color:var(--mut)}
.price{margin-left:auto;font-weight:600;white-space:nowrap}
label.f{display:block;font-weight:600;margin-bottom:6px}
input[type=email]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;font-size:1rem;background:var(--bg);color:var(--tx)}
button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.chk{display:flex;gap:8px;font-size:.9rem;color:var(--mut);margin-top:12px}
.msg{margin-top:12px;font-size:.95rem}
.err{color:#d92d20}
.ok a.dl{display:block;text-align:center;margin-top:10px;padding:13px;border-radius:8px;background:#12b76a;color:#fff;font-weight:600;text-decoration:none}
footer{color:var(--mut);font-size:.8rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<main>
  <h1>Autodesk Fusion magyarítás</h1>
  <p class="sub"></p>

  <form id="f">
    <div class="card" id="list"></div>

    <div class="card">
      <label class="f" for="email">Email cím</label>
      <input type="email" id="email" required placeholder="nev@example.com" autocomplete="email">
      <label class="chk"><input type="checkbox" id="terms" required>
        <span>Elolvastam és elfogadom az <a href="adatkezelesi.html" target="_blank" rel="noopener">adatkezelési tájékoztatót</a>, és hozzájárulok, hogy az email címemet a letöltés és a kapcsolattartás céljából eltárolják.</span></label>
      <button id="btn" type="submit">Letöltés</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </form>

  <footer>Powered by AI</footer>
</main>

<script>
// ===== BEÁLLÍTÁSOK =====
const API_URL = "https://script.google.com/macros/s/AKfycbx3AWJGSHry95Kv_sxQC7bsU_QMJBpzVOtA6HLhq57UBstGn7n_RTr4YV5xP5X008PwbQ/exec";   // Google Apps Script web app URL
const PRODUCTS = [
  {id:"fusion-magyar", name:"Autodesk Fusion magyarítás", price:""}
];
// =======================

const list = document.getElementById("list");
PRODUCTS.forEach((p,i)=>{
  list.insertAdjacentHTML("beforeend",
   `<label class="prod"><input type="radio" name="p" value="${p.id}" ${i===0?"checked":""}>
    <span><b>${p.name}</b></span><span class="price">${p.price}</span></label>`);
});

const f=document.getElementById("f"), msg=document.getElementById("msg"), btn=document.getElementById("btn");
f.addEventListener("submit", async e=>{
  e.preventDefault();
  btn.disabled=true; msg.className="msg"; msg.textContent="Egy pillanat…";
  try{
    const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({email:document.getElementById("email").value.trim(),
                           product:f.p.value})});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||"Hiba");
    if(d.status==="pending"){
      msg.className="msg"; msg.textContent="Ez az email cím még nincs jóváhagyva. A fizetés megérkezése után próbáld újra.";
    }else if(d.status==="sent"){
      msg.className="msg ok"; msg.textContent="A letöltési linket elküldtük az email címedre.";
    }else{
      msg.className="msg ok";
      msg.innerHTML=`Köszönjük! <a class="dl" href="${d.url}" target="_blank" rel="noopener">Letöltés indítása</a>`;
      window.open(d.url,"_blank");
    }
  }catch(err){
    msg.className="msg err"; msg.textContent="Nem sikerült: "+err.message;
  }finally{ btn.disabled=false; }
});
</script>
</body>
</html>
